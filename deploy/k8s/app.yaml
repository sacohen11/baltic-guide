# Requires externally provisioned Kafka/Postgres and a baltic-guide-secrets Secret.
# Replace the image with your built registry image before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: baltic-guide-config
data:
  DEMO_MODE: "false"
  EMBEDDED_RUNTIME: "false"
  ENABLE_CONNECTORS: "false"
  TRANSPORT: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka.example.internal:9093
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_REPLICATION_FACTOR: "3"
  PUBLIC_URL: https://guide.example.com
  WORKERS: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baltic-guide-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: baltic-guide, role: api}
  template:
    metadata:
      labels: {app: baltic-guide, role: api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: baltic-guide:local
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: baltic-guide-config}
            - secretRef: {name: baltic-guide-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baltic-guide-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: baltic-guide, role: worker}
  template:
    metadata:
      labels: {app: baltic-guide, role: worker}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: baltic-guide:local
          command: [baltic, worker]
          envFrom:
            - configMapRef: {name: baltic-guide-config}
            - secretRef: {name: baltic-guide-secrets}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            exec: {command: [python, scripts/worker_health.py]}
            periodSeconds: 15
            initialDelaySeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baltic-guide-connectors
spec:
  replicas: 0
  selector:
    matchLabels: {app: baltic-guide, role: connectors}
  template:
    metadata:
      labels: {app: baltic-guide, role: connectors}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: connectors
          image: baltic-guide:local
          command: [baltic, connectors]
          envFrom:
            - configMapRef: {name: baltic-guide-config}
            - secretRef: {name: baltic-guide-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: baltic-guide
spec:
  selector: {app: baltic-guide, role: api}
  ports: [{port: 80, targetPort: 8000}]
