services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:///./data/baltic.db
      TRANSPORT: local
      EMBEDDED_RUNTIME: "true"
      ENABLE_CONNECTORS: "false"
    volumes: ["demo-data:/app/data"]
    restart: unless-stopped
volumes:
  demo-data:
