# Complete Kafka/Postgres deployment for a single host. Keep host ports private.
# Replace the single broker/database with managed replicated services for high availability.
x-app: &app
  build: .
  image: baltic-guide:local
  env_file: .env
  environment: &env
    DATABASE_URL: postgresql+psycopg://baltic:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/baltic
    TRANSPORT: kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_REPLICATION_FACTOR: "1"
    DEMO_MODE: "false"
    ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
    EMBEDDED_RUNTIME: "false"
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baltic
      POSTGRES_USER: baltic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baltic -d baltic"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: ["baltic", "worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
  connectors:
    <<: *app
    command: ["baltic", "connectors"]
    profiles: ["live"]
    healthcheck: {disable: true}
volumes:
  postgres-data:
  kafka-data:
