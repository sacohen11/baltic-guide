[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baltic-guide"
version = "0.1.0"
description = "Persistent city, country, and Baltic agents for tourist guides"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.53.0", "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6", "httpx[socks]==0.28.1", "pydantic==2.13.5",
  "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "langgraph-checkpoint-postgres==3.1.2", "aiokafka==0.14.0", "feedparser==6.0.14",
  "beautifulsoup4==4.15.0", "icalendar==7.3.0", "pyyaml==6.0.3",
  "python-dotenv==1.2.3", "a2a-sdk[http-server,fastapi]==1.1.5",
  "prometheus-client==0.26.0", "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]

[project.scripts]
baltic = "baltic.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
